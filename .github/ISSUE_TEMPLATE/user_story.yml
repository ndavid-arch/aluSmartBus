name: User story
description: A feature written from the user's point of view
title: "[Story] "
labels: ["user story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <goal> so that <benefit>.
      placeholder: As a student, I want to see where the bus is so that I know when to go to my stop.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Testable conditions, written as Given / When / Then.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirements
      placeholder: FR-22, FR-23
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
